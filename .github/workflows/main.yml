name: Build and test

on:
  # push:
  #   branches:
  #     - feature/git-action
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_pgsql, pgsql

      - name: Copy .env
        run: cp src/.env.testing src/.env

      - name: Install app
        working-directory: ./src
        run: composer install

      - name: Run migrations
        working-directory: ./src
        run: php artisan migrate
      
      - name: Clear Laravel config
        working-directory: ./src
        run: php artisan config:clear

      - name: Check testing database config
        working-directory: ./src
        env:
          DB_HOST: 127.0.0.1
        run: |
          php artisan config:clear
          php artisan tinker --env=testing --execute="dump(getenv('DB_HOST')); dump(env('DB_HOST')); dump(config('database.connections.pgsql.host'));"
      
      - name: Test PHPStan
        working-directory: ./src
        run: ./vendor/bin/phpstan analyse

      - name: Test PHPUnit
        working-directory: ./src
        env:
          DB_HOST: 127.0.0.1
        run: ./vendor/bin/phpunit